<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dream Car Search Engine</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<img
			class="bg-image"
			src="https://external-content.duckduckgo.com/iu/?u=https://images.wallpapersden.com/image/download/4k-empty-road-new_bGdlaGiUmZqaraWkpJRobWllrWdma2U.jpg"
		/>
		<nav>
			<ul>
				<li class="title">
					<a href="./index.html" id="title">Your Dream Car</a>
				</li>
				<li>
					<a href="./test.html" id="take-the-test">Take the Test</a>
				</li>
				<li>
					<a href="./compare.html" id="compare"
						>Compare with Others</a
					>
				</li>
				<li id="global-stats">Global Stats</li>
				<li>
					<a id="bg-button">BG</a>
					|
					<a id="en-button">EN</a>
				</li>
			</ul>
		</nav>
		<main>
			<article id="extra" style="margin-top: 200px">
				<h1 id="compare-with-a-friend">Compare with a friend</h1>

				<div class="form">
					<label for="code" id="enter-code">Enter codes:</label><br />
					<input name="code-a" type="text" required />
					<input name="code-b" type="text" required />
				</div>

				<br /><br />
				<button id="compare-btn">Compare</button>
			</article>

			<article id="results">
				<h1 id="you-have-a">You have a similarity of</h1>
				<h1 id="similarity">30%</h1>
			</article>
		</main>

		<script src="./compare.js" type="module" defer></script>
		<script>
			let deviceMultiplier = this.visualViewport.width < 900 ? 2 : 1;

			if (localStorage.getItem('code'))
				document.querySelector('input[name="code-a"]').value =
					localStorage.getItem('code');

			document.querySelector('#results').style.display = 'none';

			let max = (this.visualViewport.width / 100) * deviceMultiplier;
			document.querySelector('.bg-image').style.filter =
				`blur(${max.toFixed(0)}px)`;

			if (deviceMultiplier == 2) {
				const nav = document.querySelector('nav');

				nav.style.overflow = 'hidden';
				nav.style.height = '50px';
				nav.style.zIndex = 100;

				let collapsed = true;

				document
					.querySelector('#title')
					.addEventListener('click', () => {
						collapsed = !collapsed;

						if (!collapsed) {
							nav.style.overflow = 'unset';
							nav.style.height = 'unset';
						} else {
							nav.style.overflow = 'hidden';
							nav.style.height = '50px';
						}
					});
			}
		</script>
	</body>
</html>
