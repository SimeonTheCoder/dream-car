<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dream Car Search Engine</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<img
			class="bg-image"
			src="https://external-content.duckduckgo.com/iu/?u=https://images.wallpapersden.com/image/download/4k-empty-road-new_bGdlaGiUmZqaraWkpJRobWllrWdma2U.jpg"
		/>
		<nav>
			<ul>
				<li class="title">
					<a href="./index.html" id="title">Your Dream Car</a>
				</li>
				<li>
					<a href="./test.html" id="take-the-test">Take the Test</a>
				</li>
				<li>
					<a href="./compare.html" id="compare"
						>Compare with Others</a
					>
				</li>
				<li id="global-stats">Global Stats</li>
				<li>
					<a id="bg-button">BG</a>
					|
					<a id="en-button">EN</a>
				</li>
			</ul>
		</nav>
		<main>
			<h1 class="slogan" id="slogan">
				Your dream car,<br />if money wasn't a problem!
			</h1>
			<button
				style="
					font-size: 40px;
					background-color: rgba(0, 0, 0, 0.95);
					padding-left: 80px;
					padding-right: 80px;
				"
				id="continue"
				onclick="document.location.href = '/dream-car/test.html'"
			>
				Continue to the Test
			</button>
		</main>

		<script>
			let deviceMultiplier = this.visualViewport.width < 900 ? 2 : 1;

			if (deviceMultiplier == 2) {
				const nav = document.querySelector('nav');

				nav.style.overflow = 'hidden';
				nav.style.height = '50px';
				nav.style.zIndex = 100;

				let collapsed = true;

				document.querySelector('nav').addEventListener('click', () => {
					collapsed = !collapsed;

					if (!collapsed) {
						nav.style.overflow = 'unset';
						nav.style.height = 'unset';
					} else {
						nav.style.overflow = 'hidden';
						nav.style.height = '50px';
					}
				});
			}
		</script>
		<script type="module">
			import { useLocalization } from './localization.js';
			useLocalization();
		</script>
	</body>
</html>
